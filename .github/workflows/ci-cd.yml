name: MMORPG Dedicated Server CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Test & Validate Docker Cluster
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 10.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Solution Dependencies
      run: dotnet restore src/MMORPG.slnx

    - name: Build MMORPG Solution (Release)
      run: dotnet build src/MMORPG.slnx --configuration Release --no-restore

    - name: Execute Automated xUnit Test Suite
      run: dotnet test tests/MMORPG.Tests/MMORPG.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Validate Docker Compose Container Build
      run: docker compose build
